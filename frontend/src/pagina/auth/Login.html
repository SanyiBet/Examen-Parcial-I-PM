<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">TL</div>
      <h2 class="login-title">TRANSLOGIC S.A.</h2>
      <p class="login-subtitle">Sistema Inteligente de Gestión de Flotas y Facturación</p>
    </div>

    <!-- Acceso rápido a credenciales de prueba -->
    <div class="demo-credentials-box">
      <div class="demo-title">Credenciales de Acceso Rápido:</div>
      <div class="demo-buttons">
        <button type="button" id="btn-quick-admin" class="btn btn-sm btn-outline">
          👑 Admin (admin@translogic.com)
        </button>
        <button type="button" id="btn-quick-operador" class="btn btn-sm btn-outline">
          🚚 Operador (operador@translogic.com)
        </button>
      </div>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Correo Electrónico</label>
        <input type="email" id="login-email" class="form-control" value="admin@translogic.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Contraseña</label>
        <input type="password" id="login-password" class="form-control" value="admin123" required>
      </div>

      <div id="login-alert" class="alert-box alert-danger" style="display: none;"></div>

      <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block">
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
