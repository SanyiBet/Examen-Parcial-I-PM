<div class="personas-list-page">
  <div class="page-title-bar">
    <div>
      <h2 class="page-title">Gestión de Personal y Conductores (Entidad Persona)</h2>
      <p class="page-subtitle">Demostración del controlador de negocio ControllersPersona y métodos de cálculo de edad</p>
    </div>
    <button id="btn-crear-persona" class="btn btn-primary">
      <span>➕</span> Registrar Persona
    </button>
  </div>

  <div class="search-filter-card">
    <div class="search-box">
      <input type="text" id="persona-search" class="form-control" placeholder="Buscar por cédula, nombres, apellidos o dirección...">
    </div>
  </div>

  <div class="table-responsive">
    <table class="table-custom">
      <thead>
        <tr>
          <th>Cédula</th>
          <th>Nombres y Apellidos</th>
          <th>Edad (Años)</th>
          <th>Edad Detallada (Años y Meses)</th>
          <th>Sexo</th>
          <th>Estado Civil</th>
          <th>Dirección</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="personas-table-body">
        <!-- Renderizado dinámico -->
      </tbody>
    </table>
  </div>

  <!-- Barra de Paginación de Personas -->
  <div class="pagination-bar" id="personas-pagination-bar">
    <div class="pagination-info">
      Mostrando <span id="personas-page-start">1</span> - <span id="personas-page-end">5</span> de <strong id="personas-total-count">0</strong> personas
    </div>
    <div class="pagination-controls">
      <div class="page-size-selector">
        <label for="personas-page-size">Por página:</label>
        <select id="personas-page-size" class="form-select form-select-sm">
          <option value="5" selected>5</option>
          <option value="10">10</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="pagination-buttons">
        <button class="btn btn-sm btn-secondary btn-page-prev" id="personas-btn-prev" disabled>◀ Anterior</button>
        <span class="page-current" id="personas-page-current">Pág. 1 de 1</span>
        <button class="btn btn-sm btn-secondary btn-page-next" id="personas-btn-next" disabled>Siguiente ▶</button>
      </div>
    </div>
  </div>
</div>
